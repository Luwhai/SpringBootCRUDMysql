spring.application.name=MyWebApp
spring.datasource.url=jdbc:mysql://localhost:3306/world
spring.datasource.username=root
spring.datasource.password=
spring..jpa.hibernate.ddl-auto=update
spring..jpa.properties.hibernate.show_sql=false
hibernate.transaction.jta.platform=true

spring.jpa.hibernate.cache.use_second_level_cache=true
spring.jpa.hibernate.cache.query_parameters_enabled=true
# Optional: Set the cache provider
spring.jpa.hibernate.cache.provider=org.hibernate.cache.EhCacheProvider

spring.profiles.active=dev

#Open-in-View
spring.jpa.open-in-view=true
spring.devtools.add-properties=false

spring.resources.static-locations=classpath:static
#thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.check-template-location=true
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML5

# enable OpenAPI 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs
